<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <!-- 設定文字編碼，避免中文顯示亂碼 -->
  <meta charset="UTF-8">

  <!-- 讓網頁能適應手機與不同螢幕尺寸 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 設定瀏覽器分頁標題 -->
  <title>我的個人網站</title>
</head>

<body>
  <!-- header：網頁的頁首區域 -->
  <header>
    <!-- h1：網頁最主要的標題 -->
    <h1>我的個人網站</h1>

    <!-- nav：放置網頁導覽連結 -->
    <nav>
      <!-- 連結到目前的首頁 -->
      <a href="index.html">首頁</a>

      <!-- 連結到同一個資料夾中的 about.html -->
      <a href="about.html">關於我</a>

      <!-- 連結到外部網站 -->
      <!-- target="_blank" 代表在新分頁開啟 -->
      <a
        href="https://www.tku.edu.tw/"
        target="_blank"
        rel="noreferrer"
      >
        淡江大學
      </a>
    </nav>
  </header>

  <!-- main：網頁的主要內容 -->
  <main>

    <!-- section：自我介紹區域 -->
    <section>
      <h2>自我介紹</h2>

      <!-- p：建立段落 -->
      <p>
        你好，我是涂凱鈞，目前就讀於淡江大學資管系。
      </p>

      <!-- 插入圖片 -->
      <!-- src：圖片檔案的位置 -->
      <!-- alt：圖片無法顯示時的替代文字 -->
      <!-- width：設定圖片寬度 -->
      <img
        src="images/profile.JPG"
        alt="我的個人照片"
        width="200"
      >


      <!-- strong：表示重要或需要強調的文字 -->
      <!-- em：表示語氣上的強調文字 -->
     
    </section> 

    <!-- section：興趣清單區域 -->
    <section>
      <h2>我的興趣</h2>

      <!-- ul：建立無序清單 -->
      <ul>
        <!-- li：清單中的一個項目 -->
        <li>打球</li>
        <li>看展覽</li>
        <li>看電影</li>
      </ul>
    </section>

    <!-- section：今年去了哪些國家 -->
    <section>
      <h2>今年去了哪些國家</h2>

      <!-- ol：建立有順序的清單 -->
      <ol>
        <li>1月 福岡</li>
        <li>2月 首爾</li>
        <li>6月 東京</li>
        <li>8月 大阪</li>
      </ol>
    </section>

    <!-- section：課程表格區域 -->
    <section>
      <h2>喜歡的Youtuber</h2>

      <!-- table：建立表格 -->
      <table>
        <!-- caption：設定表格標題 -->
        <caption>常看的YT頻道</caption>

        <!-- thead：表格的標題區域 -->
        <thead>
          <tr>
            <!-- th：表格標題欄位 -->
            <th scope="col">頻道名稱</th>
            <th scope="col">拍攝內容</th>
            <th scope="col">訂閱人數</th>
          </tr>
        </thead>

        <!-- tbody：表格的資料內容區域 -->
        <tbody>
          <!-- tr：建立一列表格資料 -->
          <tr>
            <!-- td：一般資料欄位 -->
            <td>進藤喜彥 Yoziness</td>
            <td>日常生活、3C開箱</td>
            <td>42.3萬人</td>
          </tr>

          <tr>
            <td>肥波開吃啦</td>
            <td>介紹各種不同的美食</td>
            <td>25.6萬人</td>
          </tr>

          <tr>
            <td>R榮</td>
            <td>探索不同國家的美食與風景</td>
            <td>10.5萬人</td>
          </tr>
        </tbody>
      </table>
    </section>

    <!-- div：一般區塊容器，本身沒有特殊語意 -->
    <div>
      <h2>更多資訊</h2>

      <!-- 插入連結到 about.html -->
      <p>
        <a href="about.html">查看完整自我介紹</a>
      </p>
    </div>
  </main>

  <!-- footer：網頁的頁尾區域 -->
  <footer>
    <p>© 2026 我的個人網站</p>
  </footer>
</body>

</html>
